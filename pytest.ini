[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short --strict-markers
markers =
    hardware: requires a connected physical device
    smoke: basic selected feature checks
    slow: timer, lockout or reboot scenarios
    lamp: lamp commands and logical state
    relay: relay commands and logical state
    health: telemetry
    account: login, lockout and password
    alerts: alert center
    case(id): coursework test case ID
    versions(*values): applicable firmware versions
    regression: checks for previously observed defects
